# teslabridge settings. Normally edited from the web setup page
# (http://teslabridge.local or http://10.42.0.1 on the setup Wi-Fi).
# Empty CAR / PHONE = not paired yet; the setup page pairs them.

# --- Devices ---
CAR=
CAR_ADAPTER=
CAR_NAME=teslabridge
PHONE=
PHONE_ADAPTER=
PHONE_NAME=teslabridge-phone
# 0 = no phone: no call relay, no contacts (car + SMO only)
PHONE_ENABLED=1
# Which adapter each side uses is chosen on the setup page (built-in
# Bluetooth or a USB dongle). These record whether each one is on USB, so the
# watchdog knows whether a USB power cycle can help.
CAR_ADAPTER_BUS=
PHONE_ADAPTER_BUS=

# --- Behaviour ---
# 1 = become discoverable whenever a known device is missing (release-1 style)
# 0 = only during a pairing window opened from the setup page or the button
AUTO_PAIRABLE=0
# 1 = the Pi also calls the car to reconnect it. Off by default: the Tesla
# hangs up on those calls and reconnects by itself, and a call landing at the
# same moment as the car's own connect made it drop both.
CAR_CALLS=0
# Pause the SMO while a call rings / is active, resume after
PAUSE_FOR_CALLS=1
# Seconds after a call ends before the SMO resumes
CALL_RESUME_DELAY=1.5
# Copy contacts and call history from the phone to the car
CONTACTS_SYNC=1

# --- Setup Wi-Fi (only on when needed) ---
SETUP_WIFI_SSID=teslabridge-setup
SETUP_WIFI_PASS=teslabridge
# Minutes the setup Wi-Fi stays on after boot (0 = only when unconfigured / button)
SETUP_WIFI_MINUTES=10
# Optional password for the setup page (blank = none; the Wi-Fi password protects it)
WEB_PASSWORD=
# Push button between this GPIO and GND; hold 3 s to turn the setup Wi-Fi on
SETUP_BUTTON_GPIO=26

# --- System ---
AUDIO_USER=chris
SERIAL_PORT=/dev/serial0
