name: Remove old releases
# Keeps only the newest release of each kind - the app (v*), the Pi image
# (pi-v*) and the XIAO firmware (xiao-v*) - and deletes the rest with their
# tags. Runs after each successful build, or by hand from the Actions tab.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build AuxLink app", "Build AuxLink Pi image", "Build AuxLink XIAO firmware"]
    types: [completed]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete all but the newest of each kind
        run: |
          gh release list --limit 500 --json tagName,publishedAt,isDraft \
            --jq '.[] | select(.isDraft | not) | "\(.publishedAt) \(.tagName)"' | sort -r > releases.txt
          cat releases.txt
          for kind in '^pi-v' '^xiao-v' '^v'; do
            awk -v k="$kind" '$2 ~ k' releases.txt | tail -n +2 | while read -r _ tag; do
              echo "Deleting $tag"
              gh release delete "$tag" --yes --cleanup-tag
            done
          done
