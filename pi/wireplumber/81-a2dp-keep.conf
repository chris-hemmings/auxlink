# Never idle-suspend the car's A2DP sink.
#
# A gap between tracks (or WirePlumber's 5 s idle timer) otherwise sends AVDTP
# suspend. The Tesla accepts the following start and then does not play it:
# BlueZ stays "active" and the Pi is still sending audio, but the cabin is
# silent until something pauses and starts the stream again. Pausing is still
# done explicitly by auxlink-audio (pactl suspend-sink), which is the signal
# the car should see when the music actually stops.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
