# AuxLink settings. Normally edited from the web setup page
# (http://auxlink.local or http://10.42.0.1 on the setup Wi-Fi).
# Empty CAR / PHONE = not paired yet; the setup page pairs them.

# --- Devices ---
CAR=
CAR_ADAPTER=
CAR_NAME=AuxLink
PHONE=
PHONE_ADAPTER=
PHONE_NAME=AuxLink-phone
# 0 = no phone: no call relay, no contacts (car + music source only)
PHONE_ENABLED=1
# Which adapter each side uses is chosen on the setup page (built-in
# Bluetooth or a USB dongle). These record whether each one is on USB, so the
# watchdog knows whether a USB power cycle can help.
CAR_ADAPTER_BUS=
PHONE_ADAPTER_BUS=

# --- Music source (what plays into the car) ---
# wired     = the XIAO RP2040 over I2S (track info + keys over its serial link)
# bluetooth = a phone/player pairs with SOURCE_ADAPTER as a Bluetooth speaker
#             (track info, play state and keys over Bluetooth, no app needed)
# usbc      = the Pi's USB-C port acts as a USB sound card for the source.
#             The Pi must then be POWERED EXTERNALLY (5 V GPIO pins or a
#             USB-C power/data splitter); switching needs one reboot.
MUSIC_SOURCE=wired
SOURCE=
SOURCE_ADAPTER=
SOURCE_NAME=AuxLink-music

# --- Behaviour ---
# 1 = become discoverable whenever a known device is missing
# 0 = only during a pairing window opened from the setup page or the button
AUTO_PAIRABLE=0
# Car behaviour. The defaults were tuned on a Tesla; all three are on the
# setup page (Settings) for other cars.
# 1 = the Pi also calls the car to reconnect it. Off: wait for the car (the
# Tesla hangs up on those calls, and a call landing at the same moment as its
# own connect made it drop both).
CAR_CALLS=0
# How the car's mic is borrowed for voice search on the music source:
# "call" (the car shows a call while the source listens; its hang-up button
# ends it - works on the Tesla) or "vr" (standard voice recognition - the
# Tesla ignores it, many other cars support it)
CAR_MIC_MODE=call
# 1 = try SBC-XQ music (wider stereo) when the car offers it. 0 = plain SBC
# (the Tesla disconnects when switched to SBC-XQ).
SBC_XQ=0
# Pause the music source while a call rings / is active, resume after
PAUSE_FOR_CALLS=1
# Seconds after a call ends before the music resumes
CALL_RESUME_DELAY=1.5
# Copy contacts and call history from the phone to the car
CONTACTS_SYNC=1

# --- Setup Wi-Fi (only on when needed) ---
SETUP_WIFI_SSID=AuxLink-setup
SETUP_WIFI_PASS=auxlink-setup
# Minutes the setup Wi-Fi stays on after boot (0 = only when unconfigured / button)
SETUP_WIFI_MINUTES=10
# Optional password for the setup page (blank = none; the Wi-Fi password protects it)
WEB_PASSWORD=
# Push button between this GPIO and GND; hold 3 s to turn the setup Wi-Fi on
SETUP_BUTTON_GPIO=26

# --- System ---
AUDIO_USER=chris
SERIAL_PORT=/dev/serial0
