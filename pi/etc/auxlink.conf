# AuxLink settings. Normally edited from the web setup page
# (http://auxlink.local or http://10.42.0.1 on the setup Wi-Fi).
# Empty CAR / PHONE = not paired yet; the setup page pairs them.

# --- Devices ---
CAR=
CAR_ADAPTER=
CAR_NAME=AuxLink
PHONE=
PHONE_ADAPTER=
PHONE_NAME=AuxLink-phone
# 0 = no phone: no call relay, no contacts (car + music source only)
PHONE_ENABLED=1
# Which adapter each side uses is chosen on the setup page (built-in
# Bluetooth or a USB dongle). These record whether each one is on USB, so the
# watchdog knows whether a USB power cycle can help.
CAR_ADAPTER_BUS=
PHONE_ADAPTER_BUS=

# --- Music source (what plays into the car) ---
# wired     = the XIAO RP2040 over I2S (track info + keys over its serial link)
# bluetooth = a phone/player pairs with SOURCE_ADAPTER as a Bluetooth speaker
#             (track info, play state and keys over Bluetooth, no app needed)
# usbc      = the Pi's USB-C port acts as a USB sound card for the source.
#             Power the Pi EXTERNALLY for reliable use (5 V GPIO pins or a
#             USB-C power/data splitter); switching needs one reboot.
MUSIC_SOURCE=wired
SOURCE=
SOURCE_ADAPTER=
SOURCE_NAME=AuxLink-music

# --- Behaviour ---
# 1 = become discoverable whenever a known device is missing
# 0 = only during a pairing window opened from the setup page or the button
AUTO_PAIRABLE=0
# Car behaviour. The defaults were tuned on a Tesla; all three are on the
# setup page (Settings) for other cars.
# 1 = the Pi also calls the car to reconnect it. Off: wait for the car (the
# Tesla hangs up on those calls, and a call landing at the same moment as its
# own connect made it drop both).
CAR_CALLS=0
# How the car's mic is borrowed for voice search on the music source:
# "call" (the car shows a call while the source listens; its hang-up button
# ends it - works on the Tesla) or "vr" (standard voice recognition - the
# Tesla ignores it, many other cars support it)
CAR_MIC_MODE=call
# 1 = try SBC-XQ music (wider stereo) when the car offers it. 0 = plain SBC
# (the Tesla disconnects when switched to SBC-XQ).
SBC_XQ=0
# 1 = only stream to the car while real audio is actually arriving from the
# source (like a phone: nothing is sent until you press play). Stops the car
# showing "playing" with nothing coming through, at the cost of ~1-2 s to
# spin the stream up at the start of a track. 0 = the eager default (assume
# playing unless the source says paused, so apps that don't report a pause -
# e.g. YouTube - still play).
WAIT_FOR_AUDIO=0
# Pause the music source while a call rings / is active, resume after
PAUSE_FOR_CALLS=1
# Seconds after a call ends before the music resumes (at least 3: the car
# plays no music sooner than that after a call)
CALL_RESUME_DELAY=3
# Seconds after a call / voice search (the car-mic borrow) before the music
# stream to the car is restarted. Lower = music comes back sooner after voice
# search, but too low and the Tesla swallows the first second while it's still
# leaving call mode.
CALL_SETTLE=2
# Copy contacts and call history from the phone to the car
CONTACTS_SYNC=1
# Drop the phone's Bluetooth link a while after the car's Bluetooth drops (i.e.
# the car turned off), and reconnect it when the car comes back. Uses only the
# car's own Bluetooth connection - no extra hardware. 0 = stay connected.
CAR_OFF_DROPS_PHONE=0
# Seconds the car must stay disconnected before the phone is dropped.
CAR_OFF_PHONE_DELAY=30
# 1 = also require the vehicle to be stationary (from the SMO app's location)
# before dropping the phone, so a Bluetooth blip while driving can't drop it.
# Ignored when the app isn't reporting location. 0 = car-Bluetooth only.
CAR_OFF_REQUIRE_STILL=1

# --- Setup Wi-Fi (only on when needed) ---
SETUP_WIFI_SSID=AuxLink-setup
SETUP_WIFI_PASS=auxlink-setup
# Minutes the setup Wi-Fi stays on after boot (0 = only when unconfigured / button)
SETUP_WIFI_MINUTES=10
# Optional password for the setup page (blank = none; the Wi-Fi password protects it)
WEB_PASSWORD=
# 1 = turn the Pi's Wi-Fi radio off when nothing needs it (no setup window, and
# not joined to a home network) to save ~0.2 W. Bluetooth is a separate radio
# and is unaffected (car + phone stay connected). The setup button / boot window
# turns Wi-Fi back on. 0 = leave Wi-Fi on.
WIFI_OFF_WHEN_IDLE=0
# Push button between this GPIO and GND; hold 3 s to turn the setup Wi-Fi on
SETUP_BUTTON_GPIO=26

# --- System ---
AUDIO_USER=chris
SERIAL_PORT=/dev/serial0

# Wired source: turn the SMO's media volume to 100% each time it connects
# (Android starts a USB connection low). 0 = leave it.
SMO_VOLUME_MAX=1

# Setup page: a shell on the Pi in the page (Development card), like SSH.
# Needs the Pi login password changed first. 0 = off.
DEV_TERMINAL=0

# Text messages from the phone (Bluetooth MAP). Phase 1: collected on the Pi
# (~/.local/share/auxlink/messages.json) and shown in Recent events; not
# offered to the car yet. 0 = off.
MESSAGES=0

# Calls (with Answer / Decline) and new texts as notifications on the music
# device, through the AuxLink app (USB-C or Bluetooth source). 0 = off.
SMO_NOTIFY=1
